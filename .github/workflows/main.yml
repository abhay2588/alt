name: Aaj Tak Live M3U8

on:
  workflow_dispatch:
  schedule:
    - cron: "*/50 * * * *"

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Get Aaj Tak Live URL
        run: |
          yt-dlp \
            --live-from-start \
            -g "https://www.youtube.com/@AajTak/live" \
            > aajtak.m3u8

      - name: Upload M3U8
        uses: actions/upload-artifact@v4
        with:
          name: aajtak-m3u8
          path: aajtak.m3u8

      - name: Commit Updated URL
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add aajtak.m3u8
          git commit -m "Update Aaj Tak stream" || exit 0
          git push
