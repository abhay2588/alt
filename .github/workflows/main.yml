name: Aaj Tak Live

on:
workflow_dispatch:
schedule:
- cron: '0 */6 * * *'

permissions:
contents: write

jobs:
update-stream:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'

  - name: Install yt-dlp
    run: |
      python -m pip install --upgrade pip
      pip install --upgrade yt-dlp

  - name: Show Versions
    run: |
      node --version
      python --version
      yt-dlp --version

  - name: Create Cookies File
    run: |
      cat > cookies.txt << 'EOF'
      ${{ secrets.YT_COOKIES }}
      EOF

  - name: Extract Stream URL
    run: |
      for i in 1 2 3
      do
        yt-dlp \
          --cookies cookies.txt \
          --js-runtimes node \
          --remote-components ejs:github \
          --extractor-args "youtube:player_client=web" \
          -g "https://www.youtube.com/@AajTak/live" \
          > aajtak.m3u8 && break

        sleep 30
      done

  - name: Verify Output
    run: |
      test -s aajtak.m3u8
      cat aajtak.m3u8

  - name: Commit Changes
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@github.com"

      git add aajtak.m3u8

      git commit -m "Update Aaj Tak stream" || exit 0

      git push
```

