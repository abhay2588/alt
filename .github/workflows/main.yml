name: Aaj Tak Live

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          node --version
          yt-dlp --version

      - name: Create cookies file
        run: |
          cat > cookies.txt << 'EOF'
          ${{ secrets.YT_COOKIES }}
          EOF

      - name: Extract live stream URL
        run: |
          yt-dlp \
            --cookies cookies.txt \
            --extractor-args "youtube:player_client=android,web" \
            --js-runtimes node \
            -g "https://www.youtube.com/@AajTak/live" \
            > aajtak.m3u8

      - name: Show URL
        run: cat aajtak.m3u8

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add aajtak.m3u8
          git commit -m "Update Aaj Tak stream" || exit 0
          git push
