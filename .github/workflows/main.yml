name: Aaj Tak Live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Show Versions
        run: |
          node --version
          python --version
          yt-dlp --version

      - name: Create Cookies File
        run: |
          cat > cookies.txt << 'EOF'
          ${{ secrets.YT_COOKIES }}
          EOF

      - name: Extract Stream URL
        run: |
          for i in 1 2 3
          do
            # Store output in a variable first to check if yt-dlp succeeds
            URL=$(yt-dlp \
              --cookies cookies.txt \
              --extractor-args "youtube:player_client=web" \
              -g "https://www.youtube.com/@AajTak/live" 2>/dev/null)
            
            if [ -n "$URL" ]; then
              echo "$URL" > aajtak.m3u8
              break
            fi
            
            echo "Attempt $i failed, retrying in 30 seconds..."
            sleep 30
          done

      - name: Verify Output
        run: |
          if [ ! -s aajtak.m3u8 ]; then
            echo "Error: aajtak.m3u8 is empty or does not exist."
            exit 1
          fi
          cat aajtak.m3u8

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add aajtak.m3u8

          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Aaj Tak stream"
          git push

